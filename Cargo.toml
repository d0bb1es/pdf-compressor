[package]
name = "pdf-compressor-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
# glow (OpenGL) backend: much lighter than wgpu on a low-end laptop
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
